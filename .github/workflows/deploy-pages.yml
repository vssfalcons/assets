name: Deploy assets to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download and verify Git LFS binaries
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck
          git lfs ls-files > "$RUNNER_TEMP/lfs-files.txt"
          if grep -E '^[0-9a-f]+ - ' "$RUNNER_TEMP/lfs-files.txt"; then
            echo "::error::Unresolved Git LFS pointers remain in the site."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        shell: bash
        run: |
          mkdir _site
          cp -R store index.html CNAME .nojekyll LICENSE _site/

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
